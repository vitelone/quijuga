<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="Quin partit s'està jugant ara en aquest camp? Equips, categoria i acta de l'FCF a l'instant.">
  <title>Qui Juga? · Partits en joc ara al teu camp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="logo" href="./">Qui<span>Juga</span>.cat</a>
      <button id="btn-camp" class="camp-btn" type="button" aria-haspopup="dialog">
        📍 <span id="camp-nom">Detectant…</span>
      </button>
    </header>

    <main id="contingut" class="contingut" aria-live="polite">
      <p class="estat">Carregant partits…</p>
    </main>

    <aside class="publicitat" aria-label="Publicitat">
      <div class="ad-slot">PUBLICITAT</div>
    </aside>
  </div>

  <dialog id="selector" class="selector">
    <form method="dialog" class="selector-cap">
      <input id="cerca" type="search" placeholder="Cerca camp o municipi…" autocomplete="off" aria-label="Cerca camp">
      <button class="tancar" value="cancel" aria-label="Tancar">✕</button>
    </form>
    <button id="btn-gps" type="button" class="gps-btn">📡 Usar la meva ubicació</button>
    <ul id="llista-camps" class="llista-camps"></ul>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
