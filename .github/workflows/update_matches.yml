name: Actualitza partits

# Rotació: dimarts, dimecres i dijous es refà 1/3 dels grups cada nit (~3,3 h);
# divendres es refan les tres parts SEQÜENCIALMENT (max-parallel: 1, ~10 h en total).
# Cada part fusiona el seu resultat amb el JSON de la part anterior de la setmana.

on:
  schedule:
    - cron: "30 3 * * 2-5"   # 03:30 UTC, dimarts a divendres
  workflow_dispatch:
    inputs:
      parts:
        description: 'Parts a executar, en JSON (ex. ["1/3"] o ["1/3","2/3","3/3"])'
        default: '["1/3"]'
      forca:
        description: "Ignorar la validació del 80% (vacances, inici de temporada…)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  planifica:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        env:
          MANUAL: ${{ inputs.parts }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "parts=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(date -u +%u)" in
            2) echo 'parts=["1/3"]' ;;
            3) echo 'parts=["2/3"]' ;;
            4) echo 'parts=["3/3"]' ;;
            5) echo 'parts=["1/3","2/3","3/3"]' ;;
            *) echo 'parts=[]' ;;
          esac >> "$GITHUB_OUTPUT"

  scrape:
    needs: planifica
    if: needs.planifica.outputs.parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      max-parallel: 1        # mai dues parts alhora contra l'FCF
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.planifica.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Agafa el resultat de la part anterior
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instal·la dependències
        run: pip install -r scraper/requirements.txt

      - name: Tests
        run: python -m unittest discover -s scraper/tests

      - name: Scraper (part ${{ matrix.part }})
        run: python scraper/fetch_fcf.py --part "${{ matrix.part }}" --temps-max 320 ${{ inputs.forca && '--força' || '' }}

      - name: Desa canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/partits_setmana.json scraper/camps_pendents.json scraper/camps_coords.json scraper/equips_coneguts.json
          if git diff --cached --quiet; then
            echo "Sense canvis"
            exit 0
          fi
          git commit -m "dades: partits $(date -u +%G-W%V) part ${{ matrix.part }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
